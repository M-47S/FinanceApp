# ==============================================================================
# Finance App — оркестрация API + DB.
#
# Запуск:  docker compose up -d
# Логи:    docker compose logs -f
# Стоп:    docker compose down         (том с данными сохраняется)
#         docker compose down -v        (УДАЛИТ все данные БД)
# ==============================================================================
name: finance_app

services:
  # ────────────────────────────────────────────────────────────────────────
  # DB — PostgreSQL с ролями, схемой и prime-данными
  # ────────────────────────────────────────────────────────────────────────
  db:
    image: registry.yandexcloud.net/cn1fcmh0hga61rc4jhc5/fin_db:dev
    container_name: db_container
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

      ADMIN_USER_PASSWORD:  ${ADMIN_USER_PASSWORD:?ADMIN_USER_PASSWORD is required}
      WRITER_USER_PASSWORD: ${WRITER_USER_PASSWORD:?WRITER_USER_PASSWORD is required}
      READER_USER_PASSWORD: ${READER_USER_PASSWORD:?READER_USER_PASSWORD is required}

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FinDB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────
  # API — FastAPI, общается с БД и принимает запросы от GUI
  # ────────────────────────────────────────────────────────────────────────
  api:
    image: registry.yandexcloud.net/cn1fcmh0hga61rc4jhc5/fin_api:dev
    container_name: api_container
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: FinDB
      DB_SCHEMA: report
      DB_USER: reader_user
      DB_PASSWORD: ${READER_USER_PASSWORD:?READER_USER_PASSWORD is required}

    ports:
      - "${API_PORT:-8000}:8000"

    networks:
      - backend
      - frontend

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ══════════════════════════════════════════════════════════════════════════════
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# ══════════════════════════════════════════════════════════════════════════════
volumes:
  db_data:
    driver: local